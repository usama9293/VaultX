name: VaultX CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore PasswordManager.sln

      - name: Build solution
        run: dotnet build PasswordManager.sln --no-restore

      - name: Run tests
        run: dotnet test PasswordManager.sln --no-build
